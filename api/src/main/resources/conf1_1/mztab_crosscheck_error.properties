c_code_Species=3000
c_original_Species=The column "{0}" value "{1}" should be identified the NCBI entry's name.
c_cause_Species=The human readable species the protein was identified in (this should be the NCBI entry's name)
c_fix_Species=Use the NCBI Taxonomy name of the species in column "{0}" instead of "{1}".

c_code_Database=3001
c_original_Database=The column "{0}" value "{1}" should be assigned by Miriam.
c_cause_Database=Wherever possible the Miriam (http://www.ebi.ac.uk/miriam) assigned name SHOULD be used.
c_fix_Database=Use the identifiers.org (MIRIAM) name of the database in column "{0}" instead of "{1}".

c_code_Smiles=3002
c_original_Smiles=The column "{0}" value "{1}" should obey a molecules structure of SMILES.
c_cause_Smiles=The molecules structure in the simplified molecular-input line-entry system (SMILES).
c_fix_Smiles=Correct the SMILES "{1}" in column "{0}" so that it describes a valid molecule structure.

c_code_InchiKey=3003
c_original_InchiKey= The column "{0}" value "{1}" should obey the standard InChI key.
c_cause_InchiKey=The standard IUPAC International Chemical Identifier (InChI) Key of the given substance.
c_fix_InchiKey=Replace "{1}" in column "{0}" with a standard InChIKey, e.g. BQJCRHHNABKAKU-KBQPJGBKSA-N.

c_code_OptionalCVParamColumn=3004
c_original_OptionalCVParamColumn=The column "{0}" value "{1}" should be a valid MS CV Parameter.
c_cause_OptionalCVParamColumn=This can be validated by a call to the OLS web service to validate MS CV Parameter data type.
c_fix_OptionalCVParamColumn=Write "{1}" in column "{0}" as a CV parameter: [CV label, accession, name, value].

c_code_CvTermNotAllowed=3005
c_original_CvTermNotAllowed=The cv term "{0}" is not allowed for "{1}". Allowed terms are defined in {2}.
c_cause_CvTermNotAllowed=Cv terms must be allowed for particular elements in the mztab-mappings.xml file.
c_fix_CvTermNotAllowed=Replace the term {0} on {element} with a term the validation profile allows: {allowed}.

c_code_CvTermRequired=3006
c_original_CvTermRequired=The cv term "{0}" or children thereof must be reported for "{1}". Allowed terms are defined in {2}.
c_cause_CvTermRequired=A cv term must be reported for particular elements as defined in the provided mapping file.
c_fix_CvTermRequired=Add a term to {element}. Allowed: {allowed}.

c_code_CvTermRecommended=3007
c_original_CvTermRecommended=The cv term "{0}" or children thereof should be reported for "{1}". Allowed terms are defined in {2}.
c_cause_CvTermRecommended=A cv term should be reported for particular elements as defined in the provided mapping file.
c_fix_CvTermRecommended=Add a term to {element} (recommended). Allowed: {allowed}.

c_code_CvTermOptional=3008
c_original_CvTermOptional=The cv term "{0}" or children thereof may be reported for "{1}". Allowed terms are defined in {2}.
c_cause_CvTermOptional=A cv term may be reported for particular elements as defined in the provided mapping file.
c_fix_CvTermOptional=Optionally, add a term to {element}. Allowed: {allowed}.

c_code_CvTermNotInRule=3009
c_original_CvTermNotInRule=The cv term "{0}" is not defined for "{1}". Allowed terms are defined in {2}.
c_cause_CvTermNotInRule=Cv terms must be allowed for particular elements in the mapping file.
c_fix_CvTermNotInRule=Check the term {0} on {element}: the validation profile does not list it. Allowed: {allowed}.

c_code_RulePointerObjectNull=3010
c_original_RulePointerObjectNull=The object "{0}" accessed by {1} is {2}, but was null or empty. Allowed terms are defined in {3}.
c_cause_RulePointerObjectNull=An object selected by a cv mapping rule in the mzTab model was null or empty.
c_fix_RulePointerObjectNull=Add a value for {element} ({2}). Allowed: {allowed}.

c_code_CvTermXor=3011
c_original_CvTermXor=Only one of the provided cv terms for "{1}" {0} be reported. You defined terms "{2}". Allowed terms are defined in {3}.
c_cause_CvTermXor=For a rule with XOR logic, all cv term roots given in the rule are mutually exclusive. Thus, only one cv term or its children can be reported.
c_fix_CvTermXor=Keep only one of the terms {2} on {element}. Allowed, exactly one of: {allowed}.

c_code_CvTermMalformed=3012
c_original_CvTermMalformed=The cv parameter field "{0}" for parameter "{1}" is "{2}" but should be "{3}" as defined in {4}.
c_cause_CvTermMalformed=The cv parameter fields cvLabel, cvAccession and value must conform to the cv parameter definition.
c_fix_CvTermMalformed=Change the {0} of {1} from "{2}" to "{3}".

c_code_CvUndefinedInMetadata=3013
c_original_CvUndefinedInMetadata=The CV with prefix "{0}" for parameter "{1}" MUST be defined in the metadata section! 
c_cause_CvUndefinedInMetadata=Controlled vocabularies used in the mzTab file for cv term definition MUST be defined in the metadata section.
c_fix_CvUndefinedInMetadata=Add a cv[n] entry for "{0}" to the metadata (cv[n]-label, -full_name, -version, -uri), or correct the CV label of {1}.

c_code_CvUnused=3014
c_original_CvUnused=The CV with prefix "{0}" was defined but never used. 
c_cause_CvUnused=Controlled vocabularies defined in the mzTab file metadata section SHOULD be used by cv parameters in the file.
c_fix_CvUnused=Remove the unused CV "{0}" from the metadata, or use it in a parameter.

c_code_SemanticValidationException=3015
c_original_SemanticValidationException=An exception occurred during semantic validation: "{0}".
c_cause_SemanticValidationException=General message to report exceptions that have occured during semantic validation.
c_fix_SemanticValidationException=This check could not be completed: fix the problem described in the message and validate again.

c_code_CvAccessionMalformed=3016
c_original_CvAccessionMalformed=The cv parameter "{0}" has the cv label "{1}" and the accession "{2}", which is not a valid cv term reference.
c_cause_CvAccessionMalformed=A cv parameter needs a cv label and an accession of the form <CV label>:<term number>, e.g. [UO, UO:0000072, picomolal, ], so that its term can be looked up. A user parameter leaves both empty.
c_fix_CvAccessionMalformed=Write the cv label and the accession of {element} as <CV label> and <CV label>:<term number>, e.g. UO and UO:0000072, or leave both empty to state a user parameter.

c_code_CvVersionUnavailable=3017
c_original_CvVersionUnavailable=The controlled vocabulary "{0}" in version "{1}" is not available: {2}.
c_cause_CvVersionUnavailable=The terms of a vocabulary are checked against the release the file declares in its cv entry. In a strict run that release must be found, and here it could not be: the release does not exist, it could not be downloaded or its checksum differs, it could not be parsed, no cached copy exists while offline, the vocabulary is unknown to the resources file, or only OLS could answer and OLS serves only its current release.
c_fix_CvVersionUnavailable=Check the version of {0} in the cv entry of the metadata section. To validate against the closest available release instead, run with --cvForce. To supply the vocabulary yourself, list it in a resources file and pass it with --cvResources.

c_code_CvVersionSubstituted=3018
c_original_CvVersionSubstituted=The controlled vocabulary "{0}" in version "{1}" is not available ({2}); version "{3}" from {4} was used instead.
c_cause_CvVersionSubstituted=A forced run does not stop when the declared release of a vocabulary cannot be found. It checks the terms against another release instead, which may differ from the declared one in the terms it knows and in their relations.
c_fix_CvVersionSubstituted=Check the version of {0} in the cv entry of the metadata section, or run without --cvForce to make an unavailable release an error.

c_code_CvVersionOlderThanMapping=3019
c_original_CvVersionOlderThanMapping=The controlled vocabulary "{0}" is declared in version "{1}", which is older than version "{2}" the validation rules were written for.
c_cause_CvVersionOlderThanMapping=The file declares an older release than the one the mapping rules assume. Terms the rules require may not exist in the older release, and the check is made against the declared one.
c_fix_CvVersionOlderThanMapping=Update the version of {0} in the cv entry of the metadata section to {2} or later, if the file was produced with that release.

c_code_CvVersionsNotComparable=3020
c_original_CvVersionsNotComparable=The controlled vocabulary "{0}" is declared in version "{1}", which cannot be compared with version "{2}" the validation rules were written for; the declared version is used.
c_cause_CvVersionsNotComparable=The two version strings follow different schemes, so it cannot be told which one is older. The release the file declares is used for the check.
c_fix_CvVersionsNotComparable=Write the version of {0} in the cv entry of the metadata section in the same scheme as the release, e.g. {2}.

c_code_CvVersionNotRecognised=3021
c_original_CvVersionNotRecognised=The controlled vocabulary "{0}" is declared with the version "{1}", which is not a version value; it is treated as undeclared.
c_cause_CvVersionNotRecognised=The version of a cv entry must be the release identifier of the vocabulary, e.g. a version number or a release date. Any other text cannot name a release, so the vocabulary is treated as if no version was declared.
c_fix_CvVersionNotRecognised=Write the release identifier of {0} as the version in the cv entry of the metadata section, e.g. a release number or a release date.

c_code_CvVersionNotDeclared=3022
c_original_CvVersionNotDeclared=No version is declared for the controlled vocabulary "{0}"; the latest version "{1}"{2} was used.
c_cause_CvVersionNotDeclared=A cv entry without a version does not say which release its terms come from, so the terms are checked against the latest release known. Offline, when no earlier online run has kept which release is the latest, that is the newest release in the cache.
c_fix_CvVersionNotDeclared=Declare the version of {0} in the cv entry of the metadata section, e.g. {1}, so that the file is checked against the release it was written with.

c_code_CvDeclaredTwice=3023
c_original_CvDeclaredTwice=The controlled vocabulary "{0}" is declared twice, in version "{1}" and in version "{2}"; the first entry is used and the other is ignored.
c_cause_CvDeclaredTwice=Two cv entries carry the same cv label, so terms with that label could belong to either release. Only the first entry is used for the check.
c_fix_CvDeclaredTwice=Keep a single cv entry for {0} in the metadata section, or give the second entry a different cv label.