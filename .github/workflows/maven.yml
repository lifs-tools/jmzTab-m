# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ master, release, development ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v6
      with:
        lfs: 'true'
    - name: Set up JDK 24
      uses: actions/setup-java@v5
      with:
        java-version: '24'
        distribution: 'temurin'
    - name: Set Git user
      run: |
        git config --global committer.email "noreply@github.com"
        git config --global committer.name "GitHub"
        git config --global author.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git config --global author.name "${GITHUB_ACTOR}"
    - name: Set Release version env variable
      id: version
      env:
        USERNAME: ${{ github.actor }}
        PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # let the wrapper download Maven first, its progress output would otherwise end up in VERSION
        ./mvnw -q -v > /dev/null
        VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout | tr -d '\n')
        echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    - name: Restore Maven cache
      uses: skjolber/maven-cache-github-action@v3.1.2
      with:
        step: restore
    - name: Build with Maven
      env:
        USERNAME: ${{ github.actor }}
        PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      run: ./mvnw -B package --file pom.xml
    - name: Publish Unit Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: "**/*-reports/*.xml"
    - name: Publish to GitHub Packages
      if: github.event_name == 'push'
      run: ./mvnw --batch-mode -DskipTests -DskipITs -Pgithub-snapshot deploy
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: jfrog/setup-jfrog-cli@v4
      if: github.event_name == 'push'
    - name: maven build
      if: github.event_name == 'push'
      env:
        ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
      # ARTIFACTORY_TOKEN only works as github-deployer's password (bearer use gives 401).
      # --basic-auth-only stops the CLI from exchanging it for a new token (400 for reference
      # tokens); --enc-password=false skips the password encryption call.
      run: |
            printf '%s' "$ARTIFACTORY_TOKEN" | jf c add lifs-tools --url=https://m.lifs-tools.org/ --user=github-deployer --password-stdin --basic-auth-only --enc-password=false --interactive=false --overwrite
            jf c use lifs-tools
            jf mvn-config --repo-deploy-releases=lifs-libs-release-local --repo-deploy-snapshots=lifs-libs-snapshot-local
            jf mvn -B deploy -DskipTests -DskipITs -Pjfrog --file pom.xml
            jf rt bp
    - name: Upload CLI distribution zip
      uses: actions/upload-artifact@v4
      with:
        name: jmztabm-cli-dist
        path: cli/target/jmztabm-cli-*-bin.zip
        if-no-files-found: error
    - name: Save Maven cache
      uses: skjolber/maven-cache-github-action@v3.1.2
      with:
        step: save

  native:
    name: Native binary (${{ matrix.platform }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: aarch64-macos
            binary: jmztabm-validator
          - os: ubuntu-latest
            platform: amd64-linux
            binary: jmztabm-validator
          - os: windows-latest
            platform: amd64-windows
            binary: jmztabm-validator.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: 'true'
      - name: Set up GraalVM JDK 24
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '24'
          distribution: 'graalvm-community'
          native-image-job-reports: 'true'
      - name: Restore Maven cache
        uses: skjolber/maven-cache-github-action@v3.1.2
        with:
          step: restore
      - name: Build native binary
        shell: bash
        run: ./mvnw -B -pl cli -am package -Pnative -DskipTests --file pom.xml
      - name: Save Maven cache
        uses: skjolber/maven-cache-github-action@v3.1.2
        with:
          step: save
      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: jmztabm-validator-${{ matrix.platform }}
          path: cli/target/${{ matrix.binary }}
          if-no-files-found: error

  publish-dev:
    name: Publish dev-latest pre-release
    needs: [build, native]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-latest-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: dev-latest
      VERSION: ${{ needs.build.outputs.version }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect assets under stable names
        run: |
          mkdir release
          cp dist/jmztabm-cli-dist/jmztabm-cli-*-bin.zip release/jmztabm-cli-bin.zip
          cp dist/jmztabm-validator-amd64-linux/jmztabm-validator release/jmztabm-validator-amd64-linux
          cp dist/jmztabm-validator-aarch64-macos/jmztabm-validator release/jmztabm-validator-aarch64-macos
          cp dist/jmztabm-validator-amd64-windows/jmztabm-validator.exe release/jmztabm-validator-amd64-windows.exe
          ls -l release
      - name: Update dev-latest pre-release
        run: |
          cat > notes.md <<NOTES
          Latest development build of jmzTab-m from \`master\`, replaced on every push. Not a stable release.

          - Version: \`${VERSION}\`
          - Commit: ${GITHUB_SHA}
          - Built: $(date -u +'%Y-%m-%d %H:%M UTC')
          - Workflow run: ${RUN_URL}

          The native \`jmztabm-validator-*\` binaries may need to be made executable after download (\`chmod +x\`).
          NOTES
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/${TAG}" -f sha="${GITHUB_SHA}" -F force=true
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "Latest development build (${VERSION})" --notes-file notes.md --prerelease --latest=false
          else
            gh release create "$TAG" release/* --target "${GITHUB_SHA}" --title "Latest development build (${VERSION})" --notes-file notes.md --prerelease --latest=false
          fi
